services:
  # 1. Database Service: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: budglee-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-budglee_db}
      MYSQL_USER: ${DB_USER:-budglee_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-budglee_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./devops/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budglee-network

  # 2. Redis Caching Service
  redis:
    image: redis:7-alpine
    container_name: budglee-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budglee-network

  # 3. Backend Service: Spring Boot (Java 17/21)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: budglee-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-budglee_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-budglee_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-budglee_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_SECURITY_SYSTEM_ADMIN_EMAIL: ${APP_SECURITY_SYSTEM_ADMIN_EMAIL:-}
      APP_SECURITY_SYSTEM_ADMIN_PASSWORD: ${APP_SECURITY_SYSTEM_ADMIN_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - budglee-network

  # 4. Frontend Service: React + Vite + Tailwind CSS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budglee-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - budglee-network

  # 5. Reverse Proxy: Nginx (Optional in production)
  nginx:
    image: nginx:alpine
    container_name: budglee-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - budglee-network

volumes:
  mysql_data:
  redis_data:

networks:
  budglee-network:
    driver: bridge