spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/budglee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:budglee_user}
    password: ${SPRING_DATASOURCE_PASSWORD:budglee_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  flyway:
    enabled: true # Set to true when Flyway migration is activated by Database Lead (Tu)
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    com.budglee.finance: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
