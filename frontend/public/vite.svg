<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Wallet Body Shape -->
  <rect x="14" y="20" width="36" height="26" rx="6" fill="#FFFFFF" filter="url(#glow)"/>
  
  <!-- Wallet Flap / Accent -->
  <path d="M14 26 C14 22.5 17 20 20.5 20 L43.5 20 C47 20 50 22.5 50 26 L50 29 L14 29 Z" fill="#E2E8F0"/>
  
  <!-- Wallet Clasp (Brand Accent) -->
  <path d="M36 28 H49 C50.5 28 51 29 51 30.5 L51 35.5 C51 37 50.5 38 49 38 H36 C34 38 33 36.5 33 33 C33 29.5 34 28 36 28 Z" fill="#047857"/>
  <circle cx="43" cy="33" r="2.8" fill="url(#goldGrad)"/>

  <!-- Sparkling Finance Star (Top Right) -->
  <path d="M47 8 L48.5 12 L52.5 13.5 L48.5 15 L47 19 L45.5 15 L41.5 13.5 L45.5 12 Z" fill="url(#goldGrad)"/>
</svg>
