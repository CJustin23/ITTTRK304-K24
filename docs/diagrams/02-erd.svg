<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #1A365D; }
    .sub   { font-size: 14px; fill: #4A5568; }
    .thead { fill: #1A365D; }
    .tname { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .tbody { fill: #EDF2F7; stroke: #4A5568; stroke-width: 1.4; }
    .col   { font-size: 13.5px; fill: #2D3748; }
    .key   { font-size: 13.5px; font-weight: 700; fill: #1A365D; }
    .note  { font-size: 12.5px; fill: #718096; }
    .rel   { stroke: #4A5568; stroke-width: 1.6; fill: none; }
    .card  { font-size: 13px; font-weight: 700; fill: #C05621; }
    .verb  { font-size: 12.5px; fill: #4A5568; }
  </style>

  <text class="title" x="40" y="42">Sơ đồ quan hệ dữ liệu (ERD) — Budglee, 6 bảng MySQL InnoDB</text>
  <text class="sub" x="40" y="66">Nguồn: backend/src/main/resources/db/migration/V1__init_schema.sql (tác giả: Bàng Trọng Tú) · khoá chính PK, khoá ngoại FK, tiền DECIMAL(15,2) VND</text>

  <defs>
    <marker id="crow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" stroke="#4A5568" stroke-width="1.4" fill="none"/>
    </marker>
  </defs>

  <!-- relations (drawn first, under boxes) -->
  <path class="rel" d="M650 268 V400 H295 V470" marker-end="url(#crow)"/>
  <text class="card" x="658" y="288">1</text><text class="card" x="302" y="462">N</text>
  <text class="verb" x="430" y="392">sở hữu (1 user có nhiều ví)</text>

  <path class="rel" d="M755 268 V470" marker-end="url(#crow)"/>
  <text class="card" x="763" y="292">1</text><text class="card" x="763" y="462">N</text>
  <text class="verb" x="775" y="380">tạo</text>

  <path class="rel" d="M860 268 V380 H1205 V470" marker-end="url(#crow)"/>
  <text class="card" x="868" y="292">1</text><text class="card" x="1212" y="462">N</text>
  <text class="verb" x="960" y="372">đặt hạn mức</text>

  <path class="rel" d="M600 170 H450" marker-end="url(#crow)"/>
  <text class="card" x="588" y="162">1</text><text class="card" x="460" y="162">N</text>
  <text class="verb" x="470" y="200">theo dõi mục tiêu</text>

  <path class="rel" d="M900 170 H1050" marker-end="url(#crow)"/>
  <text class="card" x="910" y="162">1</text><text class="card" x="1030" y="162">N</text>
  <text class="verb" x="915" y="200">danh mục của user</text>

  <path class="rel" d="M450 560 H600" marker-end="url(#crow)"/>
  <text class="card" x="458" y="552">1</text><text class="card" x="580" y="552">N</text>
  <text class="verb" x="465" y="586">ghi nhận giao dịch</text>

  <path class="rel" d="M1100 268 V560 H910" marker-end="url(#crow)"/>
  <text class="card" x="1108" y="292">1</text><text class="card" x="925" y="552">N</text>
  <text class="verb" x="960" y="548">phân loại</text>

  <path class="rel" d="M1250 268 V470" marker-end="url(#crow)"/>
  <text class="card" x="1258" y="292">1</text><text class="card" x="1258" y="462">N</text>
  <text class="verb" x="1268" y="380">ngân sách theo danh mục</text>

  <!-- USERS -->
  <g>
    <rect class="thead" x="600" y="100" width="300" height="34" rx="6"/>
    <text class="tname" x="750" y="123" text-anchor="middle">users</text>
    <rect class="tbody" x="600" y="134" width="300" height="134"/>
    <text class="key" x="612" y="154">PK id</text>
    <text class="col" x="612" y="174">email UNIQUE · password_hash (BCrypt)</text>
    <text class="col" x="612" y="194">full_name · avatar_url</text>
    <text class="col" x="612" y="214">role = INDIVIDUAL_USER | HEAD_OF_FAMILY</text>
    <text class="col" x="612" y="234">| FAMILY_MEMBER | ADMIN</text>
    <text class="note" x="612" y="250">family_group_id VARCHAR(50) NULL · idx_users_family</text>
  </g>

  <!-- SAVING_GOALS -->
  <g>
    <rect class="thead" x="140" y="100" width="310" height="34" rx="6"/>
    <text class="tname" x="295" y="123" text-anchor="middle">saving_goals</text>
    <rect class="tbody" x="140" y="134" width="310" height="114"/>
    <text class="key" x="152" y="154">PK id</text>
    <text class="key" x="152" y="174">FK user_id → users</text>
    <text class="col" x="152" y="194">goal_name · target_amount DEC(15,2)</text>
    <text class="col" x="152" y="214">current_amount · deadline DATE</text>
    <text class="note" x="152" y="230">status = IN_PROGRESS | COMPLETED (BR-08)</text>
  </g>

  <!-- CATEGORIES -->
  <g>
    <rect class="thead" x="1050" y="100" width="310" height="34" rx="6"/>
    <text class="tname" x="1205" y="123" text-anchor="middle">categories</text>
    <rect class="tbody" x="1050" y="134" width="310" height="134"/>
    <text class="key" x="1062" y="154">PK id</text>
    <text class="key" x="1062" y="174">FK user_id → users (NULL được phép)</text>
    <text class="col" x="1062" y="194">name · type = INCOME | EXPENSE</text>
    <text class="col" x="1062" y="214">icon · color_code</text>
    <text class="note" x="1062" y="234">user_id NULL = danh mục hệ thống (BR-05)</text>
    <text class="note" x="1062" y="250">idx_categories_user_type</text>
  </g>

  <!-- WALLETS -->
  <g>
    <rect class="thead" x="140" y="470" width="310" height="34" rx="6"/>
    <text class="tname" x="295" y="493" text-anchor="middle">wallets</text>
    <rect class="tbody" x="140" y="504" width="310" height="134"/>
    <text class="key" x="152" y="524">PK id</text>
    <text class="key" x="152" y="544">FK user_id → users ON DELETE CASCADE</text>
    <text class="col" x="152" y="564">wallet_name · card_number_masked</text>
    <text class="col" x="152" y="584">balance DECIMAL(15,2) · currency = VND</text>
    <text class="col" x="152" y="604">type = CASH | BANK | CREDIT_CARD | E_WALLET</text>
    <text class="note" x="152" y="620">family_group_id dùng cho ví chung của hộ</text>
  </g>

  <!-- TRANSACTIONS -->
  <g>
    <rect class="thead" x="600" y="470" width="310" height="34" rx="6"/>
    <text class="tname" x="755" y="493" text-anchor="middle">transactions</text>
    <rect class="tbody" x="600" y="504" width="310" height="154"/>
    <text class="key" x="612" y="524">PK id</text>
    <text class="key" x="612" y="544">FK wallet_id → users/wallets CASCADE</text>
    <text class="key" x="612" y="564">FK category_id → categories SET NULL</text>
    <text class="key" x="612" y="584">FK user_id → users CASCADE</text>
    <text class="col" x="612" y="604">action_title · amount DEC(15,2) &gt; 0 (BR-02)</text>
    <text class="col" x="612" y="624">transaction_type · balance_after · note</text>
    <text class="note" x="612" y="640">transaction_date DATETIME · idx_tx_user_date</text>
  </g>

  <!-- BUDGETS -->
  <g>
    <rect class="thead" x="1050" y="470" width="310" height="34" rx="6"/>
    <text class="tname" x="1205" y="493" text-anchor="middle">budgets</text>
    <rect class="tbody" x="1050" y="504" width="310" height="134"/>
    <text class="key" x="1062" y="524">PK id</text>
    <text class="key" x="1062" y="544">FK user_id → users CASCADE</text>
    <text class="key" x="1062" y="564">FK category_id → categories SET NULL</text>
    <text class="col" x="1062" y="584">amount_limit · spent_amount DEC(15,2)</text>
    <text class="col" x="1062" y="604">period_month · period_year</text>
    <text class="note" x="1062" y="620">alert_threshold = 80.00 → WARNING / OVER (BR-06)</text>
  </g>

  <!-- notes -->
  <g>
    <rect class="tbody" x="140" y="680" width="1220" height="120" rx="8"/>
    <text class="tname" x="160" y="703" fill="#1A365D">Ghi chú thiết kế</text>
    <text class="col" x="160" y="726">• Phân vùng dữ liệu (BR-01): mỗi hàng đều mang user_id, bản dùng chung mang family_group_id; bộ lọc lấy từ JWT đang đăng nhập, không nhận từ client.</text>
    <text class="col" x="160" y="748">• Tiền luôn là DECIMAL(15,2), không dùng FLOAT; transactions lưu cả balance_after để truy vết số dư sau mỗi lần ghi.</text>
    <text class="col" x="160" y="770">• category_id dùng ON DELETE SET NULL: xoá danh mục không làm mất lịch sử giao dịch đã ghi nhận.</text>
    <text class="note" x="160" y="790">Nợ kỹ thuật đã ghi ở SRS mục 11: family_group_id là chuỗi tự do, chưa có bảng family_groups và bảng trung gian thành viên hộ.</text>
  </g>
</svg>
