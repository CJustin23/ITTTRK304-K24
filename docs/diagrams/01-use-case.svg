<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #1A365D; }
    .sub   { font-size: 14px; fill: #4A5568; }
    .card  { fill: #EDF2F7; stroke: #4A5568; stroke-width: 1.4; rx: 8; }
    .chead { font-size: 15px; font-weight: 700; fill: #1A365D; }
    .uc    { font-size: 13.5px; fill: #2D3748; }
    .todo  { fill: #C05621; }
    .part  { fill: #B7791F; }
    .bound { fill: none; stroke: #1A365D; stroke-width: 2; stroke-dasharray: 7 5; }
    .blabel{ font-size: 17px; font-weight: 700; fill: #1A365D; }
    .actor { fill: #1A365D; }
    .aname { font-size: 14px; font-weight: 600; fill: #1A365D; }
    .link  { stroke: #718096; stroke-width: 1.3; fill: none; }
    .legend{ font-size: 13px; fill: #4A5568; }
  </style>

  <text class="title" x="40" y="44">Sơ đồ use case — Budglee Platform</text>
  <text class="sub" x="40" y="68">Nguồn: docs/SRS.md mục 3 (23 use case, UC-01…UC-23) · đối chiếu controller/*.java · vẽ theo phân công Nhóm 03</text>

