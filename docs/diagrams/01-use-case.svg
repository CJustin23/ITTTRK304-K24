  <!-- Notes -->
  <g>
    <rect class="card" x="360" y="600" width="790" height="72" rx="8"/>
    <text class="chead" x="376" y="624">Chú giải</text>
    <text class="legend" x="376" y="646">Chữ đen: đã có trong mã (controller + service) · <tspan class="part">màu nâu *: mới có bảng / service, chưa có API</tspan> · <tspan class="todo">màu cam †: chưa triển khai, kế hoạch Sprint 2–4</tspan></text>
    <text class="legend" x="376" y="664">Ràng buộc xuyên suốt: BR-01 mọi truy vấn lọc theo user_id / family_group_id lấy từ token, không nhận từ client.</text>
  </g>
