name: Budglee Platform CI/CD Pipeline

on:
  push:
    branches: [ main, develop, tu ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # 1. Backend Build & Test
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run tests with Maven Wrapper
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean test

  # 2. Migration Verification with real MySQL 8.0
  migration-ci:
    name: Flyway Migration CI (MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: budglee_db
          MYSQL_USER: budglee_user
          MYSQL_PASSWORD: budglee_secret
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306
        command:
          - --character-set-server=utf8mb4
          - --collation-server=utf8mb4_unicode_ci

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build Backend
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -DskipTests package

      - name: Run Flyway migrations against MySQL
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/budglee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: budglee_user
          SPRING_DATASOURCE_PASSWORD: budglee_secret
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          JWT_EXPIRATION_MS: 86400000
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_PASSWORD: budglee_secret
        run: |
          set -euo pipefail

          java -jar target/finance-backend-1.0.0-SNAPSHOT.jar > migration-test.log 2>&1 &
          APP_PID=$!

          trap 'kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true' EXIT

          STARTED=false

          for i in {1..90}; do
            if grep -q "Started .* in .* seconds" migration-test.log; then
              STARTED=true
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat migration-test.log
              exit 1
            fi

            sleep 2
          done

          if [ "$STARTED" != "true" ]; then
            cat migration-test.log
            echo "Backend did not start successfully."
            exit 1
          fi

          echo "Checking Flyway migration history..."

          MIGRATION_COUNT=$(docker exec \
            -e MYSQL_PWD="$MYSQL_PASSWORD" \
            "$MYSQL_CONTAINER_ID" \
            mysql -u budglee_user -D budglee_db -Nse \
            "SELECT COUNT(DISTINCT version) FROM flyway_schema_history WHERE success = 1 AND version IN ('1','2','3','4','5','6','7','8','9');")

          FAILED_COUNT=$(docker exec \
            -e MYSQL_PWD="$MYSQL_PASSWORD" \
            "$MYSQL_CONTAINER_ID" \
            mysql -u budglee_user -D budglee_db -Nse \
            "SELECT COUNT(*) FROM flyway_schema_history WHERE success = 0;")

          echo "Successfully applied migrations V1-V9: $MIGRATION_COUNT"
          echo "Failed migrations: $FAILED_COUNT"

          docker exec \
            -e MYSQL_PWD="$MYSQL_PASSWORD" \
            "$MYSQL_CONTAINER_ID" \
            mysql -u budglee_user -D budglee_db -e \
            "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;"

          if [ "$MIGRATION_COUNT" != "9" ] || [ "$FAILED_COUNT" != "0" ]; then
            cat migration-test.log
            echo "MySQL migration verification failed."
            exit 1
          fi

          echo "MySQL migration verification passed."

  # 3. Frontend Build & Test
  frontend-ci:
    name: Frontend CI (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint and Build
        working-directory: ./frontend
        run: npm run build

  # 4. Docker Compose Verification
  docker-ci:
    name: Docker Stack Validation
    needs: [backend-ci, frontend-ci, migration-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        env:
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        run: docker compose config
