  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:budglee2006@gmail.com}
    password: ${MAIL_PASSWORD:hylvtgrcveammbju}
